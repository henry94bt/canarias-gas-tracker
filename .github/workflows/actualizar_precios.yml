name: Actualizar Precios Canarias

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 08:00 hora canaria en invierno
  workflow_dispatch:        # Permite ejecutarlo a mano cuando quieras

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests pandas folium pytz

      - name: Ejecutar script de precios
        run: python mapa_pro.py

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git pull --rebase --autostash origin main
          git add index.html historico_precios.csv
          git commit -m "Actualización automática de precios: $(date +'%Y-%m-%d')" || exit 0
          git push