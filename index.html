        function actualizarTabla() {
            const isla = document.getElementById('selIsla').value;

            const cuerpo = document.getElementById('tablaCuerpo');

            let filtrados = datos.filter(d => (isla === 'Todas' || d.Isla === isla) && d[comb] !== null);
